[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "renweave"
dynamic = ["version"]
description = "Context-aware, one-click Ren'Py localization pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "RenWeave contributors" }]
dependencies = [
  "keyring>=25.0,<27",
  "PySide6-Essentials>=6.8,<6.12",
]
keywords = ["renpy", "localization", "translation", "visual-novel", "ai"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Internationalization",
]

[project.urls]
Homepage = "https://github.com/Mehael-Yeh/RenWeave"
Repository = "https://github.com/Mehael-Yeh/RenWeave"
Issues = "https://github.com/Mehael-Yeh/RenWeave/issues"

[project.scripts]
renweave = "renweave.cli:main"

[project.gui-scripts]
renweave-gui = "renweave.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/renweave"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
