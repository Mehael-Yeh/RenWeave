name: CI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and build tools
        run: python -m pip install --upgrade pip build pillow .
      - name: Run tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Compile modules
        run: python -m compileall -q src tests
      - name: Qt frontend smoke test
        run: python scripts/qt_visual_smoke_test.py
      - name: Build distributions
        run: python -m build
      - name: Verify bundled offline tools
        run: python scripts/verify_distribution.py dist
      - name: Verify CLI entry
        run: renweave --version
