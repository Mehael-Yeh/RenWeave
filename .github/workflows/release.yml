name: 发布 RenWeave
run-name: 发布 RenWeave ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发行版本号（必填，例如 2.0.0 或 2.0.0rc1；不能与已有标签重复）"
        required: true
        type: string
      prerelease:
        description: "是否标记为预发行版（测试版选中，正式版不选）"
        required: true
        default: false
        type: boolean
      draft:
        description: "是否只创建草稿（选中后不会立即公开发布）"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RENWEAVE: ${{ inputs.version }}

jobs:
  validate:
    name: 校验发行版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装版本校验工具
        run: python -m pip install --upgrade packaging

      - name: 校验版本号且确认未重复
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from packaging.version import InvalidVersion, Version

          requested = os.environ["RELEASE_VERSION"]
          try:
              parsed = Version(requested)
          except InvalidVersion as exc:
              raise SystemExit(f"Invalid PEP 440 release version: {requested!r}") from exc
          if str(parsed) != requested:
              raise SystemExit(
                  f"Use canonical PEP 440 version {str(parsed)!r} instead of {requested!r}"
              )
          print(f"Validated action-provided RenWeave version {requested}")
          PY
          if git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error title=发行版本号已存在::标签 v${RELEASE_VERSION} 已存在，请填写一个尚未使用的新版本号。"
            exit 1
          fi
          if gh release view --repo "${GITHUB_REPOSITORY}" "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error title=发行版本号已存在::发行版 v${RELEASE_VERSION} 已存在，请填写一个尚未使用的新版本号。"
            exit 1
          fi

  python-distributions:
    name: 构建 Python 安装包
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装构建工具与 RenWeave
        run: python -m pip install --upgrade pip build twine .

      - name: 运行发行测试
        run: |
          python -X utf8 -m unittest discover -s tests -v
          python -m compileall -q src tests packaging

      - name: 构建并验证 Python 安装包
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/verify_distribution.py dist
          python - <<'PY'
          import email
          import os
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(metadata_name))
          actual = metadata["Version"]
          expected = os.environ["RELEASE_VERSION"]
          if actual != expected:
              raise SystemExit(f"Wheel version {actual!r} does not match action input {expected!r}")
          print(f"Verified wheel metadata version {actual}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  windows-executable:
    name: 构建并自检 Windows EXE
    needs: validate
    runs-on: windows-latest
    env:
      RENWEAVE_BUILD_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装 EXE 构建工具与 RenWeave
        run: python -m pip install --upgrade pip pyinstaller pillow .

      - name: 构建独立 Windows 图形界面 EXE
        run: python scripts/build_windows_exe.py

      - name: 验证 EXE 版本与内置反编译器
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -LiteralPath release -Filter '*.exe' -File).FullName
          if (-not $exe) { throw 'Windows executable was not created' }
          $result = Join-Path $env:RUNNER_TEMP 'renweave-exe-self-test.json'
          $quotedResult = '"' + $result + '"'
          $process = Start-Process -FilePath $exe -ArgumentList @('--renweave-self-test', $quotedResult) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Executable self-test failed with exit code $($process.ExitCode)" }
          $payload = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          if ($payload.renweave_version -ne $env:RELEASE_VERSION) {
            throw "Executable version $($payload.renweave_version) does not match $env:RELEASE_VERSION"
          }
          if (-not $payload.bundled_tool -or $payload.unrpyc_subprocess_returncode -ne 0) {
            throw 'Bundled unrpyc subprocess verification failed'
          }
          Get-Content -LiteralPath $result

      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: release/*.exe
          if-no-files-found: error

  publish:
    name: 创建 GitHub 发行版并上传全部文件
    needs: [python-distributions, windows-executable]
    runs-on: ubuntu-latest
    env:
      RELEASE_DRAFT: ${{ inputs.draft }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 检查发行文件并生成校验和
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          release = Path("release")
          expected_exe = release / f"RenWeave-{os.environ['RELEASE_VERSION']}-windows-x64.exe"
          wheels = list(release.glob("renweave-*.whl"))
          source_archives = list(release.glob("renweave-*.tar.gz"))
          if not expected_exe.is_file():
              raise SystemExit(f"Missing required Windows executable: {expected_exe.name}")
          if len(wheels) != 1 or len(source_archives) != 1:
              raise SystemExit(
                  "Expected exactly one wheel and one source archive; "
                  f"found {len(wheels)} wheel(s) and {len(source_archives)} source archive(s)"
              )

          lines = []
          for artifact in sorted(release.iterdir()):
              if not artifact.is_file() or artifact.stat().st_size == 0:
                  raise SystemExit(f"Invalid release artifact: {artifact}")
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              lines.append(f"{digest}  {artifact.name}")
          Path("SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Ready to publish:")
          print("\n".join(f"- {artifact.name}" for artifact in sorted(release.iterdir())))
          PY

      - name: 创建 GitHub 发行版
        shell: bash
        run: |
          options=()
          if [[ "${RELEASE_DRAFT}" == "true" ]]; then options+=(--draft); fi
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then options+=(--prerelease); fi
          gh release create --repo "${GITHUB_REPOSITORY}" "v${RELEASE_VERSION}" release/* SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "RenWeave ${RELEASE_VERSION}" \
            --generate-notes \
            "${options[@]}"
